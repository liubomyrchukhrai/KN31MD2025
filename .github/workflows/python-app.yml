name: Python and C++ Tests

on:
  push:
    branches: [ "Development" ]
  pull_request:
    branches: [ "Development" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # === PYTHON ===
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Python tests
      run: |
        pytest

    # === C++ ===
    - name: Install C++ dependencies
      run: |
        sudo apt update
        sudo apt install -y g++ cmake make

    - name: Build C++ project
      run: |
        mkdir -p build
        cd build
        cmake .. || echo "No CMakeLists.txt found, skipping CMake"
        make || echo "No Makefile found or no targets to build"

    - name: Run C++ tests
      run: |
        if [ -d build ]; then
          cd build
          if [ -f runTests ]; then
            ./runTests
          elif [ -f test ]; then
            ./test
          else
            echo "No C++ test executable found. Skipping C++ tests."
          fi
        else
          echo "No build directory found. Skipping C++ tests."
        fi
